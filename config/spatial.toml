index_type = "spatial"

# ==============================================================================
# 4. Compound equality prefix + SPATIAL index
# ==============================================================================

[[scans]]
id = "spatial_compound_radius"
iterations = 500

[[scans.runs]]
name = "select(id) where(status = published AND geo::distance < 250km)"
projection = "ID"

[[scans.runs]]
name = "select(*) where(status = published AND geo::distance < 250km)"
projection = "FULL"

[[scans.runs]]
name = "count(*) where(status = published AND geo::distance < 250km)"
projection = "COUNT"

[scans.condition]
surrealdb = "status = 'published' AND geo::distance(location, (2.3522, 48.8566)) < 250000"
mongodb = { status = "published", location = { "$geoWithin" = { "$centerSphere" = [[2.3522, 48.8566], 0.0391963986] } } }

[scans.with_index]
fields = ["status", "location"]
index_type = "spatial"

[[scans.with_writes]]
ratio = 0.15
mode = "interleaved"
operation = "UPDATE"

[[scans.with_writes]]
ratio = 0.50
mode = "interleaved"
operation = "UPDATE"

[[scans]]
id = "spatial_compound_bbox"
iterations = 500

[[scans.runs]]
name = "select(id) where(status = published AND location INSIDE medium_bbox)"
projection = "ID"

[[scans.runs]]
name = "select(*) where(status = published AND location INSIDE medium_bbox)"
projection = "FULL"

[[scans.runs]]
name = "count(*) where(status = published AND location INSIDE medium_bbox)"
projection = "COUNT"

[scans.condition]
surrealdb = 'status = "published" AND location INSIDE { type: "Polygon", coordinates: [[[0.0, 46.0], [5.0, 46.0], [5.0, 51.0], [0.0, 51.0], [0.0, 46.0]]] }'
mongodb = { status = "published", location = { "$geoWithin" = { "$geometry" = { type = "Polygon", coordinates = [[[0.0, 46.0], [5.0, 46.0], [5.0, 51.0], [0.0, 51.0], [0.0, 46.0]]] } } } }

[scans.with_index]
fields = ["status", "location"]
index_type = "spatial"

[[scans]]
id = "spatial_compound_2prefix_radius"
iterations = 500

[[scans.runs]]
name = "select(id) where(status = published AND category = restaurant AND geo::distance < 250km)"
projection = "ID"

[[scans.runs]]
name = "select(*) where(status = published AND category = restaurant AND geo::distance < 250km)"
projection = "FULL"

[[scans.runs]]
name = "count(*) where(status = published AND category = restaurant AND geo::distance < 250km)"
projection = "COUNT"

[scans.condition]
surrealdb = "status = 'published' AND category = 'restaurant' AND geo::distance(location, (2.3522, 48.8566)) < 250000"
mongodb = { status = "published", category = "restaurant", location = { "$geoWithin" = { "$centerSphere" = [[2.3522, 48.8566], 0.0391963986] } } }

[scans.with_index]
fields = ["status", "category", "location"]
index_type = "spatial"

# ==============================================================================
# 5. Batches
# ==============================================================================

[[batches]]
name = "batch_create_100"
operation = "CREATE"
batch_size = 100
iterations = 100

[[batches]]
name = "batch_read_100"
operation = "READ"
batch_size = 100
iterations = 100
