# Full-text search benchmark. Times the query shapes a full-text index serves
# over a corpus whose terms are spread the way natural text spreads them: a
# few words in nearly every document, most in few.
#
# Corpus — `body` holds 20 to 200 words drawn from a 20,000-word vocabulary
# whose rank-r word is drawn with probability proportional to 1/r (`corpus:`
# value type), and four planted terms at fixed document frequencies, which the
# queries below search for. Documents differ in length, as text does, so BM25
# spreads a term's scores across them; at one length a term's score would take
# only as many values as its frequency does, and a ranked query's top k would
# end in a tie of thousands, flattering any engine that stops at its k-th score.
#
#   tier     term      documents
#   stop     kolvak    92%   (a stop-word-like term: almost every document)
#   common   trimbol   60%
#   mid      quorlat    7%
#   rare     vexin      0.6%
#
# `title` holds 4 to 12 words of the same vocabulary, with its own planted terms:
# zelmor in 30% of titles, quorlat in 5% and vexin in 1%. The cross-field
# scans at the end search both fields, each through its own index.
#
# The planted terms spell no vocabulary word and survive English stemming
# unchanged, so every engine indexes them as written.
#
# Index — every single-field scan reads one full-text index on `body`, shared
# by name (`with_index.name`), so it is built once before the first scan and
# dropped after the last. The cross-field scans share it with a second index on
# `title` (`with_indexes`). `indexed_only` skips the legs without them: a
# full-text predicate without its index tokenises every row.
#
# Engines — SurrealDB (BM25, `search::score`), PostgreSQL (`tsvector`, GIN,
# `ts_rank`), MySQL (InnoDB FULLTEXT, `MATCH ... AGAINST` relevance), MongoDB
# (`text` index, `textScore`; one text index a collection, which `$text`
# cannot point at one field of, so no cross-field scans) and Neo4j (unranked
# single-field shapes only). Each engine
# scores with its own model, analyzer and stemming; compare an engine with
# itself across shapes and builds, and read cross-engine numbers as different
# features answering the same question, not a head-to-head of one algorithm.
#
# Shapes — for each tier: the match count, an unranked listing, and the
# ten best matches by score. For the common term, also the hundred best, the
# ten best after the first thousand, the ten best of a filtered match, and the
# ten best while 15% and 50% of iterations also write. Then ranked AND and OR
# of two terms, across tiers, and ranked AND and OR of one term in `body` and
# one in `title`, ordered by the sum of the two fields' scores.
#
# Ranked shapes answer in well under a millisecond with a warm index, so they
# run at one client and one thread: at the default concurrency their latency
# measures the queue rather than the search.

# Corpus seed: the same rows for every engine and every run.
seed = 20261119

# ============================================================================
# value
# ============================================================================

[value]
body = "corpus:20..200;20000;1.0;kolvak@0.92,trimbol@0.6,quorlat@0.07,vexin@0.006"
n = "int:1..1000"
title = "corpus:4..12;20000;1.0;zelmor@0.3,quorlat@0.05,vexin@0.01"
# ============================================================================
# fulltext_stop_count
# ============================================================================
[[scans]]
id = "fulltext_stop_count"
name = "count() where(body @@ stop) - 92.0% of documents"
projection = "COUNT"
iterations = 200
clients = 1
threads = 1

[scans.condition]
sql = "to_tsvector('english', body) @@ to_tsquery('english', 'kolvak')"
mysql = "MATCH(body) AGAINST('kolvak' IN NATURAL LANGUAGE MODE)"
neo4j = "kolvak"
surrealdb = "body @@ 'kolvak'"
mongodb = { "$text" = { "$search" = "kolvak" } }

[scans.with_index]
name = "body_fulltext"
fields = ["body"]
index_type = "fulltext"
indexed_only = true

# ============================================================================
# fulltext_stop_list
# ============================================================================
[[scans]]
id = "fulltext_stop_list"
iterations = 200
limit = 1000

[[scans.runs]]
name = "select(id) where(body @@ stop) limit(1000)"
projection = "ID"

[[scans.runs]]
name = "select(*) where(body @@ stop) limit(1000)"
projection = "FULL"

[scans.condition]
sql = "to_tsvector('english', body) @@ to_tsquery('english', 'kolvak')"
mysql = "MATCH(body) AGAINST('kolvak' IN NATURAL LANGUAGE MODE)"
neo4j = "kolvak"
surrealdb = "body @@ 'kolvak'"
mongodb = { "$text" = { "$search" = "kolvak" } }

[scans.with_index]
name = "body_fulltext"
fields = ["body"]
index_type = "fulltext"
indexed_only = true

# ============================================================================
# fulltext_stop_top10
# ============================================================================
[[scans]]
id = "fulltext_stop_top10"
name = "select(id) where(body @@ stop) order(score DESC) limit(10)"
projection = "ID"
iterations = 1000
clients = 1
threads = 1
limit = 10

[scans.condition]
sql = "to_tsvector('english', body) @@ to_tsquery('english', 'kolvak')"
mysql = "MATCH(body) AGAINST('kolvak' IN NATURAL LANGUAGE MODE)"
surrealdb = "body @1@ 'kolvak'"
mongodb = { "$text" = { "$search" = "kolvak" } }

[scans.order_by]
sql = "ts_rank(to_tsvector('english', body), to_tsquery('english', 'kolvak')) DESC"
mysql = "MATCH(body) AGAINST('kolvak' IN NATURAL LANGUAGE MODE) DESC"
surrealdb = "search::score(1) DESC"
mongodb = { score = { "$meta" = "textScore" } }

[scans.with_index]
name = "body_fulltext"
fields = ["body"]
index_type = "fulltext"
indexed_only = true

