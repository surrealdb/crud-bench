[scans.condition]
sql = "to_tsvector('english', body) @@ to_tsquery('english', 'trimbol') AND to_tsvector('english', title) @@ to_tsquery('english', 'zelmor')"
mysql = "MATCH(body) AGAINST('trimbol' IN NATURAL LANGUAGE MODE) AND MATCH(title) AGAINST('zelmor' IN NATURAL LANGUAGE MODE)"
surrealdb = "body @1@ 'trimbol' AND title @2@ 'zelmor'"

[scans.order_by]
sql = "ts_rank(to_tsvector('english', body), to_tsquery('english', 'trimbol')) + ts_rank(to_tsvector('english', title), to_tsquery('english', 'zelmor')) DESC"
mysql = "MATCH(body) AGAINST('trimbol' IN NATURAL LANGUAGE MODE) + MATCH(title) AGAINST('zelmor' IN NATURAL LANGUAGE MODE) DESC"
surrealdb = "score DESC"

[scans.extra_fields]
surrealdb = "search::score(1) + search::score(2) AS score"

[scans.with_index]
name = "body_fulltext"
fields = ["body"]
index_type = "fulltext"
indexed_only = true

[[scans.with_indexes]]
name = "title_fulltext"
fields = ["title"]
index_type = "fulltext"

