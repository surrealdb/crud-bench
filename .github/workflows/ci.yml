name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  # Use github.run_id on main branch
  # Use github.event.pull_request.number on pull requests, so it's unique per pull request
  # Use github.ref on other branches, so it's unique per branch
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Jobs that need more (the compile jobs' `id-token: write`) say so themselves.
permissions:
  contents: read

# Compile jobs (clippy, test, build) compile through .github/actions/kache,
# which assumes a GitHub OIDC role, so each is granted `id-token: write`. A
# push to main runs its writer legs on a GitHub-hosted runner of the leg's
# architecture, bound to the `cache-writer` environment; every other run keeps
# its self-hosted label and the reader role.

# Hosted writer legs must run the Ubuntu release of the self-hosted image
# (24.04), so their labels name it rather than `-latest`. kache keys build
# scripts, proc-macros and C/C++ objects on libc, CRT objects, linker and
# compiler, so a writer on another release publishes entries no self-hosted
# leg can hit.

# A push-to-main leg without a writer binds the `cache-reader` environment, so
# its OIDC subject is `...:environment:cache-reader`, meant for the kache
# reader alone, never `...:ref:refs/heads/main`, which roles outside the cache
# may trust. The binding is load-bearing: `cache-reader` must exist with no
# protection rules and no secrets. The fence assumes no workflow_dispatch or
# schedule trigger, since a self-hosted leg one of those started from main
# would present the main-ref subject.

# Hosted writer legs get the longer timeout: they compile on 4 vCPU, cold
# whenever the trusted prefix lacks their entries, and a job that times out
# skips kache's upload, so a limit a cold build cannot meet keeps the prefix
# cold. Each job's kache-session-seconds is its timeout plus 15 minutes.

# rust-cache (registry only) runs before kache: it hashes the CARGO*, CC*, CXX*
# and RUST* environment into its key, and must not see kache's wrapper paths.

# Enters the kache and rust-cache keys, so every job sets it alike. Line tables
# keep debug and test builds within a standard hosted runner's disk.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  format:
    name: Check format
    runs-on: [runner-arm-4-cores-spot]
    steps:
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check format
        run: cargo fmt --all --check

  clippy:
    name: Check clippy
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ubuntu-24.04-arm' || 'runner-arm-16-cores-spot' }}
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'cache-writer' || '' }}
    timeout-minutes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 90 || 20 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false

      - name: Setup kache
        uses: ./.github/actions/kache
        with:
          kache-remote: 'true'
          kache-writer: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          kache-session-seconds: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 6300 || 2100 }}

      - name: Check clippy
        run: cargo clippy --tests --all-features -- -D warnings

      - name: Show disk headroom
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        continue-on-error: true
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" && du -sh target "$RUNNER_TEMP/kache"

  test:
    name: Check tests
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ubuntu-24.04-arm' || 'runner-arm-16-cores-spot' }}
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'cache-writer' || '' }}
    timeout-minutes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 120 || 30 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false

      - name: Setup kache
        uses: ./.github/actions/kache
        with:
          kache-remote: 'true'
          kache-writer: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          kache-session-seconds: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 8100 || 2700 }}

      - name: Check tests
        run: cargo test

      - name: Show disk headroom
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        continue-on-error: true
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" && du -sh target "$RUNNER_TEMP/kache"

  build:
    name: Build crud-bench (${{ matrix.name }})
    strategy:
      matrix:
        include:
          # writer-runner is the GitHub-hosted runner a push to main builds the
          # leg on as the compile cache writer; empty keeps the leg on `runner`
          # with the reader role, read-only, for pushes to main as well.
          - name: amd64
            runner: runner-amd-32-cores-spot
            writer-runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # No writer leg: the release build (fat LTO, one codegen unit) needs
          # more memory than a standard GitHub-hosted arm64 runner provides, so
          # on every event it compiles on the self-hosted label with the reader
          # role, read-only.
          - name: arm64
            runner: runner-arm-32-cores-spot
            writer-runner: ''
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.writer-runner || matrix.runner }}
    # On a push to main: `cache-writer` for the writer leg, and the load-bearing
    # `cache-reader` for the leg without one (see the header). None otherwise.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (matrix.writer-runner != '' && 'cache-writer' || 'cache-reader') || '' }}
    timeout-minutes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.writer-runner != '' && 180 || 60 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false

      - name: Setup kache
        uses: ./.github/actions/kache
        with:
          kache-remote: 'true'
          kache-writer: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.writer-runner != '' }}
          kache-session-seconds: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.writer-runner != '' && 11700 || 4500 }}

      - name: Build benchmark
        run: cargo build --release --target ${{ matrix.target }}

      - name: Show disk headroom
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        continue-on-error: true
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" && du -sh target "$RUNNER_TEMP/kache"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crud-bench-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/crud-bench

  docker-build:
    name: Build Docker image
    runs-on: [runner-arm-4-cores-spot-private]
    needs: build
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download amd64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crud-bench-amd64
          path: ${{ github.workspace }}/artifacts/crud-bench-amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crud-bench-arm64
          path: ${{ github.workspace }}/artifacts/crud-bench-arm64

      - name: Review downloaded artifacts
        run: find artifacts

      - name: Make crud-bench executable
        run: chmod +x ${{ github.workspace }}/artifacts/crud-bench-amd64/crud-bench ${{ github.workspace }}/artifacts/crud-bench-arm64/crud-bench

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          REGION=${{ secrets.REGISTRY_AWS_REGION }}
          REGISTRY=${{ secrets.REGISTRY_AWS_ACCOUNT_ID }}.dkr.ecr.$REGION.amazonaws.com
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=${{ secrets.REGISTRY_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.REGISTRY_AWS_REGION }}.amazonaws.com/docker-hub/moby/buildkit:buildx-stable-1

      - name: Set docker tag
        id: image
        run: |
          set -x
          DOCKER_REPO=${{ steps.login-ecr.outputs.registry }}/crud-bench
          DOCKER_TAG=$(git rev-parse --short "$GITHUB_SHA")
          echo "docker-repo=$DOCKER_REPO" >> $GITHUB_OUTPUT
          echo "docker-tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

      - name: Build Docker image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: github.event_name == 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.docker-repo }}:${{ steps.image.outputs.docker-tag }}

      - name: Build and push Docker image for release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.docker-repo }}:${{ steps.image.outputs.docker-tag }}
          push: true

  benchmark:
    name: Benchmark ${{ matrix.description }}
    needs: build
    runs-on: [ubuntu-latest]
    env:
      CRUD_BENCH_CONFIG: ${{ github.workspace }}/config/ci.toml
    strategy:
      fail-fast: false
      matrix:
        include:
          # ArangoDB
          - name: arangodb
            database: arangodb
            enabled: true
            description: ArangoDB
          # Cassandra
          - name: cassandra
            database: cassandra
            enabled: false
            description: Cassandra
            skipped: Cassandra benchmark not yet implemented
          # Dragonfly
          - name: dragonfly
            database: dragonfly
            enabled: true
            description: Dragonfly
          # Dry
          - name: dry
            database: dry
            enabled: true
            description: Dry
          # Fjall
          - name: Fjall
            database: fjall
            enabled: true
            description: Fjall
          # KeyDB
          - name: keydb
            database: keydb
            enabled: true
            description: KeyDB
          # LMDB
          - name: lmdb
            database: lmdb
            enabled: true
            description: LMDB
          # Map
          - name: map
            database: map
            enabled: true
            description: Map
          # MariaDB
          - name: mariadb
            database: mariadb
            enabled: false
            description: MariaDB
            skipped: MariaDB benchmark fails with connection errors when running mixed workloads
          # MDBX
          - name: mdbx
            database: mdbx
            enabled: true
            description: MDBX
          # MongoDB
          - name: mongodb
            database: mongodb
            enabled: true
            description: MongoDB
          # MySQL
          - name: mysql
            database: mysql
            enabled: true
            description: MySQL
          # Neo4j
          - name: neo4j
            database: neo4j
            enabled: true
            description: Neo4j
          # Postgres
          - name: postgres
            database: postgres
            enabled: true
            description: Postgres
          # Redb
          - name: redb
            database: redb
            enabled: true
            description: ReDB
          # Redis
          - name: redis
            database: redis
            enabled: true
            description: Redis
          # RocksDB
          - name: rocksdb
            database: rocksdb
            enabled: true
            description: RocksDB
          # ScyllaDB
          - name: scylladb
            database: scylladb
            enabled: false
            description: ScyllaDB
            skipped: ScyllaDB benchmark not yet implemented
          # SlateDB
          - name: slatedb
            database: slatedb
            enabled: true
            description: SlateDB
          # SQLite
          - name: sqlite
            database: sqlite
            enabled: true
            description: SQLite
          # SurrealDB + Memory
          - name: surrealdb-memory
            database: surrealdb
            endpoint: -e server:memory
            enabled: true
            description: SurrealDB with in-memory storage
          # SurrealDB + SurrealKV
          - name: surrealdb-surrealkv
            database: surrealdb
            endpoint: -e server:surrealkv
            enabled: true
            description: SurrealDB with SurrealKV storage
          # SurrealDB Memory Engine
          - name: surrealdb-embedded-memory
            database: surrealdb
            enabled: true
            endpoint: -e memory
            description: SurrealDB embedded with in-memory storage
          # SurrealDB SurrealKV Engine
          - name: surrealdb-embedded-surrealkv
            database: surrealdb
            enabled: true
            endpoint: -e surrealkv:~/crud-bench
            description: SurrealDB embedded with SurrealKV storage
          # SurrealDB 2.x + Memory
          - name: surrealdb2-memory
            database: surrealdb2
            endpoint: -e server:memory
            enabled: true
            description: SurrealDB 2.x with in-memory storage
          # SurrealDB 2.x + RocksDB
          - name: surrealdb2-rocksdb
            database: surrealdb2
            endpoint: -e server:rocksdb
            enabled: true
            description: SurrealDB 2.x with RocksDB storage
          # SurrealDB 2.x + SurrealKV
          - name: surrealdb2-surrealkv
            database: surrealdb2
            endpoint: -e server:surrealkv
            enabled: true
            description: SurrealDB 2.x with SurrealKV storage
          # SurrealDB 2.x Memory Engine
          - name: surrealdb2-embedded-memory
            database: surrealdb2
            enabled: true
            endpoint: -e memory
            description: SurrealDB 2.x embedded with in-memory storage
          # SurrealDB 2.x RocksDB Engine
          - name: surrealdb2-embedded-rocksdb
            database: surrealdb2
            enabled: true
            endpoint: -e rocksdb:~/crud-bench
            description: SurrealDB 2.x embedded with RocksDB storage
          # SurrealDB 2.x SurrealKV Engine
          - name: surrealdb2-embedded-surrealkv
            database: surrealdb2
            enabled: true
            endpoint: -e surrealkv:~/crud-bench
            description: SurrealDB 2.x embedded with SurrealKV storage
          # SurrealDB 3.x + Memory
          - name: surrealdb3-memory
            database: surrealdb3
            endpoint: -e server:memory
            enabled: true
            description: SurrealDB 3.x with in-memory storage
          # SurrealDB 3.x + RocksDB
          - name: surrealdb3-rocksdb
            database: surrealdb3
            endpoint: -e server:rocksdb
            enabled: true
            description: SurrealDB 3.x with RocksDB storage
          # SurrealDB 3.x + SurrealKV
          - name: surrealdb3-surrealkv
            database: surrealdb3
            endpoint: -e server:surrealkv
            enabled: true
            description: SurrealDB 3.x with SurrealKV storage
          # SurrealDB 3.x Memory Engine
          - name: surrealdb3-embedded-memory
            database: surrealdb3
            enabled: true
            endpoint: -e memory
            description: SurrealDB 3.x embedded with in-memory storage
          # SurrealDB 3.x RocksDB Engine
          - name: surrealdb3-embedded-rocksdb
            database: surrealdb3
            enabled: true
            endpoint: -e rocksdb:~/crud-bench
            description: SurrealDB 3.x embedded with RocksDB storage
          # SurrealDB 3.x SurrealKV Engine
          - name: surrealdb3-embedded-surrealkv
            database: surrealdb3
            enabled: true
            endpoint: -e surrealkv:~/crud-bench
            description: SurrealDB 3.x embedded with SurrealKV storage
          # SurrealKV
          - name: surrealkv
            database: surrealkv
            enabled: true
            description: SurrealKV
          # SurrealMX
          - name: surrealmx
            database: surrealmx
            enabled: true
            description: SurrealMX
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: config

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crud-bench-amd64
          path: ${{ github.workspace }}/artifacts

      - name: Set file permissions
        run: chmod +x ${{ github.workspace }}/artifacts/crud-bench

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: System Information
        run: |
          echo "=== Environment Variables ==="
          env
          echo "=== Kernel & OS Info ==="
          uname -a
          echo "=== CPU Details (lscpu) ==="
          lscpu
          echo "=== First 50 lines of /proc/cpuinfo ==="
          head -n 50 /proc/cpuinfo
          echo "=== First 50 lines of /proc/meminfo ==="
          head -n 50 /proc/meminfo
          echo "=== Cgroup Information (/proc/self/cgroup) ==="
          cat /proc/self/cgroup

      - name: ${{ matrix.skipped || 'Benchmark processing' }}
        if: ${{ !matrix.enabled }}
        run: echo "${{ matrix.skipped }}"

      - name: Clean up environment
        if: ${{ matrix.enabled }}
        run: |
          # Clean up data directory
          rm -rf ~/crud-bench
          mkdir -p ~/crud-bench
          chmod 777 ~/crud-bench
          # Remove old results
          rm -f result*.html
          rm -f result*.json
          rm -f result*.csv

      - name: Optimise system
        if: ${{ matrix.enabled }}
        run: |
          # Flush disk writes
          sync
          # Increase max limits
          ulimit -n 65536 || true
          ulimit -u unlimited || true
          ulimit -l unlimited || true

      - name: Run benchmarks (10,000 samples / 12 clients / 4 threads / key integer / random)
        timeout-minutes: 5
        if: ${{ matrix.enabled && (success() || failure()) }}
        run: |
          # Kill and remove any existing crud-bench container
          docker container kill crud-bench &>/dev/null || true
          docker container rm crud-bench &>/dev/null || true
          # Prune stopped containers and volumes
          docker container prune --force &>/dev/null || true
          docker volume prune --all --force &>/dev/null || true
          # Clean up data directory
          rm -rf ~/crud-bench
          mkdir -p ~/crud-bench
          chmod 777 ~/crud-bench
          # Run the benchmarks
          ${{ github.workspace }}/artifacts/crud-bench -d ${{ matrix.database }} ${{ matrix.endpoint || '' }} -s 10000 -c 12 -t 4 -k integer -r -n integer-random
          # Kill and remove any existing crud-bench container
          docker container kill crud-bench &>/dev/null || true
          docker container rm crud-bench &>/dev/null || true
          # Prune stopped containers and volumes
          docker container prune --force &>/dev/null || true
          docker volume prune --all --force &>/dev/null || true
        env:
          DOCKER_PRE_ARGS: ${{ matrix.DOCKER_PRE_ARGS || '' }}
          DOCKER_POST_ARGS: ${{ matrix.DOCKER_POST_ARGS || '' }}

      - name: Run benchmarks (10,000 samples / 12 clients / 4 threads / key string26 / random)
        timeout-minutes: 5
        if: ${{ matrix.enabled && (success() || failure()) }}
        run: |
          # Kill and remove any existing crud-bench container
          docker container kill crud-bench &>/dev/null || true
          docker container rm crud-bench &>/dev/null || true
          # Prune stopped containers and volumes
          docker container prune --force &>/dev/null || true
          docker volume prune --all --force &>/dev/null || true
          # Clean up data directory
          rm -rf ~/crud-bench
          mkdir -p ~/crud-bench
          chmod 777 ~/crud-bench
          # Run the benchmarks
          ${{ github.workspace }}/artifacts/crud-bench -d ${{ matrix.database }} ${{ matrix.endpoint || '' }} -s 10000 -c 12 -t 4 -k string26 -r -n string26-random
          # Kill and remove any existing crud-bench container
          docker container kill crud-bench &>/dev/null || true
          docker container rm crud-bench &>/dev/null || true
          # Prune stopped containers and volumes
          docker container prune --force &>/dev/null || true
          docker volume prune --all --force &>/dev/null || true
        env:
          DOCKER_PRE_ARGS: ${{ matrix.DOCKER_PRE_ARGS || '' }}
          DOCKER_POST_ARGS: ${{ matrix.DOCKER_POST_ARGS || '' }}

      - name: Run benchmarks (10,000 samples / 12 clients / 4 threads / key string90 / random)
        timeout-minutes: 5
        if: ${{ matrix.enabled && (success() || failure()) }}
        run: |
          # Kill and remove any existing crud-bench container
          docker container kill crud-bench &>/dev/null || true
          docker container rm crud-bench &>/dev/null || true
          # Prune stopped containers and volumes
          docker container prune --force &>/dev/null || true
          docker volume prune --all --force &>/dev/null || true
          # Clean up data directory
          rm -rf ~/crud-bench
          mkdir -p ~/crud-bench
          chmod 777 ~/crud-bench
          # Run the benchmarks
          ${{ github.workspace }}/artifacts/crud-bench -d ${{ matrix.database }} ${{ matrix.endpoint || '' }} -s 10000 -c 12 -t 4 -k string90 -r -n string90-random
          # Kill and remove any existing crud-bench container
          docker container kill crud-bench &>/dev/null || true
          docker container rm crud-bench &>/dev/null || true
          # Prune stopped containers and volumes
          docker container prune --force &>/dev/null || true
          docker volume prune --all --force &>/dev/null || true
        env:
          DOCKER_PRE_ARGS: ${{ matrix.DOCKER_PRE_ARGS || '' }}
          DOCKER_POST_ARGS: ${{ matrix.DOCKER_POST_ARGS || '' }}

      - name: Run benchmarks (10,000 samples / 12 clients / 4 threads / key string250 / random)
        timeout-minutes: 10
        if: ${{ matrix.enabled && (success() || failure()) }}
        run: |
          # Kill and remove any existing crud-bench container
          docker container kill crud-bench &>/dev/null || true
          docker container rm crud-bench &>/dev/null || true
          # Prune stopped containers and volumes
          docker container prune --force &>/dev/null || true
          docker volume prune --all --force &>/dev/null || true
          # Clean up data directory
